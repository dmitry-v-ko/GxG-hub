# GxG Hub Python workspace (M0). See docs/implementation-plan-v1.md, milestone M0.
[project]
name = "gxg-hub"
version = "0.0.0"
description = "GxG Hub monorepo root: dev tooling, contract tests, unit tests of all packages."
requires-python = ">=3.12"
dependencies = [
    "gxg-connector-kit",
    "gxg-approval",
    "gxg-policy",
    "gxg-connector-demo",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-socket==0.8.1",  # AC-M0-01: no internet socket in tests
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-PyYAML>=6,<7",
    "types-jsonschema>=4.23,<5",
    # tests/contract (mirrors tests/contract/requirements.txt)
    "jsonschema>=4.23,<5",
    "PyYAML>=6,<7",
    "openapi-spec-validator>=0.7,<1",
    # gxg-connector-kit: property tests (AC-M1-02) and branch coverage gate (AC-M1-09)
    "hypothesis>=6.100,<7",
    "pytest-cov>=6,<8",
    # DoD-4: mutation testing (root: [tool.mutmut] below; kit: packages/gxg-connector-kit/pyproject.toml)
    "mutmut==3.8.1",
    "cryptography>=44,<51",
    # spikes/m4-contextforge verifier tests: the PyJWT version in the pinned ContextForge image
    "PyJWT==2.15.1",
    "httpx>=0.27,<1",
    "docker>=7.1,<8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/gxg-connector-kit", "approval", "tools/gxg-policy"]
# Connectors keep their own lockfile (docs/specs/mcp-toolkit-v1.md, demo-connector-v1.md);
# the root pulls them in by path only to run their unit tests.
exclude = ["connectors/*"]

[tool.uv.sources]
gxg-connector-kit = { workspace = true }
gxg-approval = { workspace = true }
gxg-policy = { workspace = true }
gxg-connector-demo = { path = "connectors/demo", editable = true }

[tool.pytest.ini_options]
minversion = "8.3"
# AC-M0-01: pytest-socket refuses to create any socket except Unix ones (TCP, UDP, IPv6).
addopts = [
    "-ra", "-p", "pytester", "--strict-markers", "--strict-config", "--import-mode=importlib",
    "--disable-socket", "--allow-unix-socket",
]
testpaths = [
    # tests/secrets is not here: it downloads gitleaks (AC-M0-01); the `secrets` CI job runs it.
    "tests/ci",
    "tests/contract",
    "packages/gxg-connector-kit/tests",
    "approval/tests",
    "tools/gxg-policy/tests",
    "connectors/demo/tests",
    "spikes/m4-contextforge/tests",
    "spikes/m4.1-gateways/tests",
    "gateway/contextforge/tests",
]
# DoD-5: a skipped or xfailed test is a failure, not a pass.
xfail_strict = true
# `from scripts.ci import ...` in tests: mutmut tracks code by its dotted module name.
# Test helpers of gxg-connector-kit (kit_testing.py); importlib mode does not add test dirs to sys.path.
pythonpath = [".", "packages/gxg-connector-kit/tests"]
markers = [
    "e2e: runs a CI script as a subprocess; mutmut deselects these (its trampolines do not reach child processes)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "mutants"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "PL", "RUF"]
ignore = [
    "PLR2004",  # magic values are normal in tests and schema code
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
# Tests and CI scripts run git/pytest subprocesses and use assert by design.
"**/tests/**" = ["S101", "S603", "S607", "PLC0415"]
"**/tests_db/**" = ["S101", "S603", "S607", "PLC0415", "S608"]  # S608: SQL built from test constants
"conftest.py" = ["S101"]
"scripts/ci/**" = ["S603", "S607"]
"stand/*.py" = ["S603", "S607"]  # dev stand scripts run docker compose and gxg-policy
"approval/src/gxg_approval/cli.py" = ["PLC0415"]  # each process imports only what it runs
"approval/src/gxg_approval/migrations/**" = ["S101", "S608", "E501"]  # static DDL from code constants

[tool.ruff.lint.isort]
known-first-party = ["gxg_connector_kit", "gxg_approval", "gxg_policy", "demo_connector"]

[tool.mypy]
# Baseline for every package; the strict set is enforced separately with
# `mypy --strict` on gxg-connector-kit and approval (see .github/workflows/ci.yml).
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
# scripts/ci is imported as `scripts.ci.*` (tests, mutmut), not as top-level modules.
explicit_package_bases = true
mypy_path = ["packages/gxg-connector-kit/src", "packages/gxg-connector-kit/tests", "approval/src", "tools/gxg-policy/src", "connectors/demo/src", ".", "approval/tests_db"]

[[tool.mypy.overrides]]
# gateway/contextforge/gxg_identity/plugin.py runs inside the ContextForge image, where cpex is installed
module = ["cpex.*"]
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "preserve"
# Specs are normative text: never rewrite code samples inside Markdown.
exclude = ["*.md"]

[tool.mutmut]
# DoD-4, one command for every root module with key conditions: scripts/ci/mutmut.sh
# (also runs tools/gxg-policy, which has its own section; the kit has its own section too).
# M0.1 (AC-M0.1-03): scripts/ci/ and conftest.py, every mutant killed.
# M2: scripts/ci/widening_gate.py; survivors only if listed in scripts/ci/mutmut-equivalent.txt.
source_paths = ["scripts/ci/", "conftest.py"]
# Outside every DoD-4 scope, tested end to end only: the M1 coverage gate (AC-M1-09) and the
# M2 bash/YAML and M7 SQL mutation drivers (scripts/ci/mutate_m*.py, not key-condition modules).
do_not_mutate = ["scripts/ci/check_coverage.py", "scripts/ci/mutate_m2.py", "scripts/ci/mutate_m7_sql.py"]
also_copy = ["schemas/", "policies/", "docs/", "tests/", ".github/"]
# test_grants_widening_job.py runs the M2 job script in temp repos (subprocesses, like the e2e tests):
# in neither milestone's mutmut test selection.
pytest_add_cli_args = ["-m", "not e2e", "-p", "no:cacheprovider", "--ignore=tests/ci/test_grants_widening_job.py"]
pytest_add_cli_args_test_selection = ["tests/ci/", "tests/contract/"]
