# M4 spike stand: ContextForge (pinned digest) + PostgreSQL + echo MCP server.
# Local only. Secrets come from .env (generated by gen_env.sh, git-ignored).
name: gxg-m4-spike
services:
  postgres:
    image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_DB: mcp
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run gen_env.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 2s
      retries: 30
    networks: [internal]

  echo:
    # Same pinned image as ContextForge: its Python has PyJWT + cryptography for the variant C verifier.
    image: ghcr.io/ibm/mcp-context-forge:v1.1.1@sha256:16c7a8985c1a3528ba49fcab32951e06c9a41a171fc5c41d24b085283c4556a5
    entrypoint: ["python3", "-I", "/app/echo_mcp.py", "9000"]
    user: "0:0"  # writes the log into the host's secrets/raw
    volumes:
      - ./echo:/app:ro
      - ./secrets/raw:/data
    # Published on loopback only to run the "bypass ContextForge" attack (criterion 2).
    ports: ["127.0.0.1:9000:9000"]
    networks: [internal]

  contextforge:
    image: ghcr.io/ibm/mcp-context-forge:v1.1.1@sha256:16c7a8985c1a3528ba49fcab32951e06c9a41a171fc5c41d24b085283c4556a5
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:4444:4444"]
    environment:
      HOST: "0.0.0.0"
      PORT: "4444"
      APP_DOMAIN: "http://localhost:4444"
      DATABASE_URL: postgresql+psycopg://mcp:${POSTGRES_PASSWORD}@postgres:5432/mcp
      AUTH_REQUIRED: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?run gen_env.sh}
      AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:?run gen_env.sh}
      JWT_AUDIENCE: "mcpgateway-api"
      JWT_ISSUER: "mcpgateway"
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?run gen_env.sh}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?run gen_env.sh}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?run gen_env.sh}
      MCPGATEWAY_UI_ENABLED: "false"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      EMAIL_AUTH_ENABLED: "true"
      # Variant A under test: signed identity propagation, off by default in ContextForge.
      IDENTITY_PROPAGATION_ENABLED: "true"
      IDENTITY_PROPAGATION_MODE: "both"
      IDENTITY_SIGN_CLAIMS: "true"
      IDENTITY_CLAIMS_SECRET: ${IDENTITY_CLAIMS_SECRET:?run gen_env.sh}
      ENABLE_HEADER_PASSTHROUGH: ${ENABLE_HEADER_PASSTHROUGH:-false}
      PLUGINS_ENABLED: ${PLUGINS_ENABLED:-false}
      # The echo server is on a private docker network.
      SSRF_ALLOW_PRIVATE_NETWORKS: "true"
      LOG_LEVEL: "INFO"
    networks: [internal]

networks:
  internal: {}
