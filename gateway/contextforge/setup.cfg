# DoD-4 (M5): mutmut on the identity adapter's decision and claims. Run from this directory:
# `uv run mutmut run` (scripts/ci/mutmut.sh does it). plugin.py needs cpex (only in the ContextForge image):
# it is a thin adapter, tested live on the stand (stand/tests).
[mutmut]
source_paths = gxg_identity/
only_mutate = gxg_identity/core.py
pytest_add_cli_args_test_selection = tests/
pytest_add_cli_args = -p no:cacheprovider -q
