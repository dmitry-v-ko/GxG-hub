# F4: direct edits of approval rules
tenant: t-alpha
schema_version: 1
rules:
  - id: msg
    match:
      tools: [demo.message.propose]
    decision: require_approval
    approvers: ['oidc:https://idp.example.invalid:1']
  - id: kb-auto
    match:
      tools: [demo.message.propose]
      resources: [kb:kb-main/collection/public]
    decision: auto_approve
    limits: { max_per_hour: 5 }
  - id: hermes-auto
    match:
      tools: [demo.message.propose]
      requesters: [agent:t-alpha:hermes, agent:t-alpha:analyst]
    decision: auto_approve
    limits: { max_per_hour: 5 }
