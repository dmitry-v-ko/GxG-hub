[project]
name = "gxg-policy"
version = "0.0.0"
description = "GxG Hub policy tooling : validate, lint, diff, build, verify (M2)."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44,<47",
    "jsonschema>=4.23,<5",
    "pyyaml>=6,<7",
    "rfc3339-validator>=0.1.4,<0.2",  # enables the `date-time` format check of jsonschema (expires_at offset)
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gxg_policy"

[project.scripts]
gxg-policy = "gxg_policy.cli:main"

# DoD-4: mutation testing of the modules with M2 key conditions. Run from the repo root: scripts/ci/mutmut.sh
[tool.mutmut]
source_paths = ["src/gxg_policy/"]
only_mutate = ["*/diff.py", "*/lint.py", "*/bundle.py", "*/load.py"]
pytest_add_cli_args_test_selection = ["tests"]
