# Manifest of the reference connector `demo` (docs/specs/demo-connector-v1.md, MCC-01).
# Stage B (M3): read tools only. demo.message.propose joins in M8 (schemas/examples/demo.gxg-manifest.yaml).
connector: demo
version: 0.1.0
contract: gxg-mcp-connector/v1
tools:
  - name: demo.boards.list
    version: 1.0.0
    title: "Список досок"
    effect_class: read
    action: read
    resource: { type: board, scope: list }
    input_schema: schemas/boards-list.input.json
    output_schema: schemas/boards-list.output.json
    limits: { timeout_s: 10 }
  - name: demo.notes.search
    version: 1.0.0
    title: "Поиск заметок"
    effect_class: read
    action: read
    resource: { type: board, scope: list }
    input_schema: schemas/notes-search.input.json
    output_schema: ../../schemas/search-result.schema.json
    limits: { max_results: 50, timeout_s: 20 }
  - name: demo.note.get
    version: 1.0.0
    title: "Заметка"
    effect_class: read
    action: read
    resource: { type: board, scope: single, from_arg: note_id, resolve: backend }
    input_schema: schemas/note-get.input.json
    output_schema: schemas/note-get.output.json
    limits: { timeout_s: 10 }
