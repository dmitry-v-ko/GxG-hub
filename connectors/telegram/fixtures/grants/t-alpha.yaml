    subjects: [agent:t-alpha:reader]
    actions: [read]
    resources:
      - telegram:tg-main/chat/tgc1_p_9lawHi_ooJlPEFNsEP-_cyzUfsAMqZ
      - telegram:tg-main/chat/tgc1_qSJPyTsrJM5DsCiK-ktzZW_G4ROtF3Dv
      - telegram:tg-main/chat/tgc1_hcImubsK1nq6gEYGfX-8XKMpfwDXlvJ0
  - id: alpha-reader-collect          # collect on a-partners and a-gap: read on a-sales gives no collect
    subjects: [agent:t-alpha:reader]
    actions: [collect]
    resources:
      - telegram:tg-main/chat/tgc1_p_9lawHi_ooJlPEFNsEP-_cyzUfsAMqZ
      - telegram:tg-main/chat/tgc1_hcImubsK1nq6gEYGfX-8XKMpfwDXlvJ0
  - id: alpha-reader-secret-expired   # GR-06: expired, gives nothing (SC-10)
