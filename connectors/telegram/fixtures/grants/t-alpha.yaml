# Test grants of the Telegram connector (M11). Synthetic: chat_refs of fixtures/service.json, no secrets.
tenant: t-alpha
schema_version: 1

connections:
  - id: tg-main
    domain: telegram
    credential_ref: secret://t-alpha/telegram/main

principals:
  agents:
    - id: agent:t-alpha:reader
    - id: agent:t-alpha:nobody

grants:
