# Manifest of the Telegram MCP connector (docs/specs/service-integration-v1.md#telegram, MCC-01).
# Stage D (M11): read tools over the existing Telegram service. telegram.message.propose comes in stage E.
connector: telegram
version: 0.1.0
contract: gxg-mcp-connector/v1
tools:
  - name: telegram.messages.search
    version: 1.0.0
    title: "Поиск сообщений"
    effect_class: read
    action: read
    resource: { type: chat, scope: list }
    input_schema: schemas/messages-search.input.json
    output_schema: ../../schemas/search-result.schema.json
    limits: { max_results: 50, timeout_s: 20 }
  - name: telegram.thread.read
    version: 1.0.0
    title: "История чата"
    effect_class: read
    action: read
    resource: { type: chat, scope: single, from_arg: chat_ref, resolve: arg }
    input_schema: schemas/thread-read.input.json
    output_schema: schemas/messages.output.json
    limits: { max_results: 50, timeout_s: 20 }
  - name: telegram.messages.collect
    version: 1.0.0
    title: "Сбор сообщений по cursor"
    effect_class: read
    action: collect
    resource: { type: chat, scope: single, from_arg: chat_ref, resolve: arg }
    input_schema: schemas/messages-collect.input.json
    output_schema: schemas/messages.output.json
    limits: { max_results: 100, timeout_s: 20 }
