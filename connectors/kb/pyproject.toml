[project]
name = "gxg-connector-kb"
version = "0.1.0"
description = "KB wrapper connector: read-only KB tools with per-collection grants (M6)."
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.8",  # pulls the official MCP SDK (mcp), Starlette and uvicorn
    "gxg-connector-kit",
    "httpx2>=2.16.2,<3",  # the KB client's HTTP (backend.py); already installed by mcp
    "pyyaml>=6,<7",  # gxg-manifest.yaml is read at start; already installed by fastmcp
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kb_connector"

[tool.uv.sources]
# editable: the root workspace installs the kit editable too, uv needs one URL per package
gxg-connector-kit = { path = "../../packages/gxg-connector-kit", editable = true }
# editable: gxg-policy finds the repository schemas/ from its own source location
gxg-policy = { path = "../../tools/gxg-policy", editable = true }

[dependency-groups]
# Standalone `uv run pytest` inside connectors/kb. The repository-wide policy
# (no network, no skip/xfail) applies when tests run from the repository root.
dev = ["pytest>=8.3,<10", "gxg-policy", "mutmut==3.8.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true

# DoD-4: modules with the M6 key conditions: collection grants, not_found, the check order of every call,
# context budget (tools.py), the fake-KB filter (backend.py), verifier selection, profile guard, bundle loading,
# readiness (server.py).
# Run from this directory: `uv run mutmut run` (scripts/ci/mutmut.sh does it in CI).
[tool.mutmut]
source_paths = ["src/kb_connector/"]
only_mutate = ["*/tools.py", "*/backend.py", "*/server.py"]
also_copy = ["fixtures/", "schemas/", "gxg-manifest.yaml"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
