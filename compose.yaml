# Local development ONLY. Do not expose directly to the internet.
# ContextForge is used as an external OCI dependency, not forked.
# Default image removed deliberately: no accidental fallback to insecure prerelease.
# DEV-ONLY: a release tag in .env is NOT an immutable digest or production approval.
# Effects are NOT enabled by this Compose; effect execution path / identity PoC is separate.
services:
  contextforge:
    image: ${CONTEXTFORGE_IMAGE:?Set CONTEXTFORGE_IMAGE to an audited, patched release in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4444:4444"
    environment:
      HOST: "0.0.0.0"
      PORT: "4444"
      APP_DOMAIN: "http://localhost:4444"
      AUTH_REQUIRED: "true"
      # Default deny: no effects or identity propagation until the trusted security PoC.
      IDENTITY_PROPAGATION_ENABLED: "false"
      PLUGINS_ENABLED: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:?Set AUTH_ENCRYPTION_SECRET in .env}
      JWT_AUDIENCE: "mcpgateway-api"
      JWT_ISSUER: "mcpgateway"
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?Set PLATFORM_ADMIN_EMAIL in .env}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Set PLATFORM_ADMIN_PASSWORD in .env}
      PLATFORM_ADMIN_FULL_NAME: "GxG Hub Operator"
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      DATABASE_URL: "sqlite:////data/mcp.db"
    volumes:
      - contextforge-data:/data

volumes:
  contextforge-data:
