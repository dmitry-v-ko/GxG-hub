# Agent entry of the stand: the same mapping as the agent port (443) of `tailscale serve` on Railway
# (deploy/railway/services.yaml GXG_TS_SERVE): virtual servers and /health only. /rpc, the global /mcp and /sse are
# not published (owner decision 2026-11-26: close /rpc to agents). Operators keep 127.0.0.1:4444 (the 8443 twin).
events {}
http {
  server {
    listen 8080;
    location /servers { proxy_pass http://contextforge:4444; proxy_buffering off; proxy_read_timeout 120s; }
    location /health { proxy_pass http://contextforge:4444; }
    location / { return 404; }
  }
}
