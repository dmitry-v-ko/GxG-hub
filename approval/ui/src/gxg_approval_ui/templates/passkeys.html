{% extends "base.html" %}
{% block main %}
<h1>Passkey</h1>
<p id="passkey-state">{% if has_passkey %}Passkey зарегистрирован.{% else %}Passkey нет: решения принимать нельзя.{% endif %}</p>
<p>Регистрация — по одноразовому приглашению оператора (его выдают вне этого интерфейса).</p>
<label>Приглашение <input id="invite" autocomplete="off"></label>
<button id="register" data-csrf="{{ csrf }}">Зарегистрировать passkey</button>
<p id="register-result"></p>
{% endblock %}
