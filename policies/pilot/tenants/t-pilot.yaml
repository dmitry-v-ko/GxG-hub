# Pilot tenant. One human (the owner, approver), no grants on chats yet: they are added after the owner picks the chats
# in the UI wizard (reports/M13-LIVE.md). No secrets: credential_ref points to the secret store. Format: docs/specs/resource-grants-v1.md
tenant: t-pilot
schema_version: 1

connections:
  - id: tg-pilot
    domain: telegram
    credential_ref: secret://t-pilot/telegram/pilot

principals:
  agents:
    - id: agent:t-pilot:pilot

  humans:
    - id: oidc:https://accounts.google.com:115004991056982692610
      roles: [approver]  # the pilot owner (approver in the UI; operator is GXG_ADMIN_OPERATORS / GXG_UI_OPERATORS, not a grants role)

grants:
  # The three chats the owner chose for the pilot (Telegram wizard, scope of the connection). Read and collect for the
  # pilot agent; propose (a message to send, approved by a person with a passkey) only in the test chat «GxG Agents».
  - id: tg-pilot-read
    subjects: [agent:t-pilot:pilot]
    actions: [read, collect]
    resources:
      - telegram:tg-pilot/chat/tgc1_I9x0Dy0hLblcgy5bMjEJSo-jet-QZ8_w
      - telegram:tg-pilot/chat/tgc1__ESCaowLpuoPpwq6ti-Oo8lSdcyI75Pi
      - telegram:tg-pilot/chat/tgc1_fg2agKZmFgzytfmaAUzf3ZbkczoPSmN8
    expires_at: "2026-12-24T00:00:00Z"
    reason: "Pilot M13: the chats chosen by the owner"
  - id: tg-pilot-propose
    subjects: [agent:t-pilot:pilot]
    actions: [propose]
    resources:
      - telegram:tg-pilot/chat/tgc1_fg2agKZmFgzytfmaAUzf3ZbkczoPSmN8
    expires_at: "2026-12-24T00:00:00Z"
    reason: "Pilot M13: test sends to GxG Agents, every one approved by the owner"
