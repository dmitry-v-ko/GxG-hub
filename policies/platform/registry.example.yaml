# Example platform registry (synthetic keys). Format: docs/specs/approval-service-v1.md#реестр-платформы
schema_version: 1
services:
  - id: executor
    kind: executor
    public_keys: [ed25519:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA]
    tenants: ["*"]
  - id: approval-mcp
    kind: approval_mcp
    public_keys: [ed25519:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB]
    tenants: ["*"]
  - id: demo
    kind: connector
    public_keys: [ed25519:CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC]
    tenants: [t-alpha, t-beta]
    internal_url: https://demo.internal:8081
    tools:
      - { name: demo.notes.search, version: 1.0.0, effect_class: read, action: read }
      - { name: demo.message.propose, version: 1.0.0, effect_class: external_effect, action: propose, executes_via: demo.message.execute, dispatch_timeout_s: 60 }
webhooks:
  - id: signals-alpha
    tenant: t-alpha
    url: https://signals.internal/hooks/gxg
    secret_ref: secret://t-alpha/webhooks/signals
